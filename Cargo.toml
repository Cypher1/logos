[package]
name = "logos"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = { version = "0.26", features = ["crossterm"] }
crossterm = "0.27"
ratatui-textarea = "0.9.2"
ratatui-comfy-tabs = "0.5.12"
ratatui-scrollbar = "0.0.0"
ratatui-scrollview = "0.0.0"
ollama-rs = { version = "0.3.5", features = ["tokio", "stream", "tool-implementations"] }
futures-util = "0.3"
redb = "4.1.0"
