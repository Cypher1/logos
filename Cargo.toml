[package]
name = "logos"
version = "0.1.0"
edition = "2024"

[features]
default = ["ollama"]
ollama = ["ollama-rs"]
[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = { version = "0.30.2", features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-textarea = "0.9.2"
ollama-rs = { version = "0.3.5", features = ["tokio", "stream", "tool-implementations"], optional = true }
futures-util = "0.3"
redb = "4.1.0"
signal-hook = "0.4.4"
pretty_env_logger = "0.5.0"
toml = "1.1.2"
tokio-stream = "0.1.18"
anyhow = "1.0.103"
pretty_assertions = "1.4.1"
thiserror = "2.0.19"
